<div class="row">
    <div class="col-12 mb-3 d-print-none">
        <div class="card shadow-sm border-0 border-top border-primary border-4">
            <div class="card-body py-3">
                <div class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label text-muted small fw-bold mb-1">ពីថ្ងៃទី (From Date)</label>
                        <input type="date" class="form-control form-control-sm" id="repAttFrom">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-muted small fw-bold mb-1">ដល់ថ្ងៃទី (To Date)</label>
                        <input type="date" class="form-control form-control-sm" id="repAttTo">
                    </div>
                    <div class="col-md-6 text-end">
                        <button class="btn btn-primary btn-sm px-3" onclick="generateAttendanceReport()">
                            <i class="bi bi-search"></i> ស្វែងរក
                        </button>
                        <button class="btn btn-secondary btn-sm px-3 ms-2" onclick="printAttReport()">
                            <i class="bi bi-printer"></i> បោះពុម្ព / PDF
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 print-template" id="print-area-att-report">
        <div class="card shadow-sm border-0 print-no-border">
            <div class="card-header bg-white border-bottom text-center py-3 position-relative">
                <img id="brand-logo-report-att" src="" style="max-height: 70px; display: none; position: absolute; left: 20px; top: 15px;">
                <h4 class="mb-1 text-dark" style="font-family: 'Khmer OS Muol Light', cursive; font-size: 1.1rem;">របាយការណ៍វត្តមានបុគ្គលិកលម្អិត</h4>
                <p class="mb-0 text-muted small" id="repAttDateText"></p>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive" id="rep-attendance-table-container">
                    <div id="report-tables-wrapper">
                        <table class="table table-hover table-bordered align-middle text-center mb-0 att-table print-table">
                            <thead class="table-darkgreen" id="repAttHead">
                                <tr>
                                    <th class="py-4 text-muted">សូមជ្រើសរើសកាលបរិច្ឆេទ រួចចុចប៊ូតុងស្វែងរក</th>
                                </tr>
                            </thead>
                            <tbody id="repAttList">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

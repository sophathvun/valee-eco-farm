                <div class="card shadow-sm border-0 border-top border-primary border-4">
                    <div class="card-header bg-body d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 text-primary fw-bold" data-i18n="new_invoice_title">បង្កើតវិក្កយបត្រ</h5>
                        <span class="badge bg-info text-dark" data-i18n="invoice_auto_income_note">ពេលព្រីនវិក្កយបត្រ វានឹងកត់ត្រាចូលជាចំណូលដោយស្វ័យប្រវត្តិ!</span>
                    </div>
                    <div class="card-body">
                        <form id="invoiceForm">
                            <!-- Invoice Header Details -->
                            <div class="row mb-3">
                                <div class="col-md-2">
                                    <label class="form-label" data-i18n="invoice_no_field">លេខវិក្កយបត្រ</label>
                                    <input type="text" class="form-control" id="inv-no" required placeholder="001">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label" data-i18n="date_field">កាលបរិច្ឆេទ</label>
                                    <input type="date" class="form-control" id="inv-date" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label" data-i18n="customer_field">អតិថិជន</label>
                                    <input type="text" class="form-control" id="inv-customer" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label" data-i18n="phone_field">លេខទូរស័ព្ទ</label>
                                    <input type="text" class="form-control" id="inv-phone">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label" data-i18n="address_field">អាសយដ្ឋាន</label>
                                    <input type="text" class="form-control" id="inv-address">
                                </div>
                            </div>
                            <hr>
                            <!-- Invoice Items Table -->
                            <div class="table-responsive mb-3">
                                <table class="table table-bordered text-center" id="inv-items-table">
                                    <thead class="table-darkgreen">
                                        <tr>
                                            <th data-i18n="th_item_no">លេខផលិតផល</th>
                                            <th data-i18n="th_item_desc">បរិយាយមុខទំនិញ</th>
                                            <th data-i18n="th_mass_unit">មាឌ/ឯកតា</th>
                                            <th data-i18n="th_price_unit">តម្លៃ/ឯកតា</th>
                                            <th data-i18n="th_total">សរុប</th>
                                            <th data-i18n="actions">សកម្មភាព</th>
                                        </tr>
                                    </thead>
                                    <tbody id="inv-items-body"></tbody>
                                </table>
                            </div>
                            <button type="button" class="btn btn-outline-primary mb-3" onclick="addInvoiceRow()" data-i18n="btn_add_item">+ បន្ថែមទំនិញ</button>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="lbl_income_category">ប្រភេទចំណូល</label>
                                        <select class="form-select" id="inv-income-category" required></select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="lbl_invoice_currency">រូបិយប័ណ្ណ</label>
                                        <select class="form-select" id="inv-currency" onchange="calculateInvoiceTotal()">
                                            <option value="KHR" selected data-i18n="currency_khr">ប្រាក់រៀល (៛)</option>
                                            <option value="USD" data-i18n="currency_usd">ដុល្លារសហរដ្ឋអាមេរិក ($)</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="lbl_payment_method">វិធីទូទាត់</label>
                                        <select class="form-select" id="inv-method" required>
                                            <option value="Cash" data-i18n="method_cash">សាច់ប្រាក់</option>
                                            <option value="Bank" data-i18n="method_bank">ធនាគារ</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <table class="table table-borderless text-end">
                                        <tr><td data-i18n="lbl_subtotal">សរុប៖</td><td><input type="text" class="form-control text-end" id="inv-subtotal" readonly value="0"></td></tr>
                                        <tr><td data-i18n="lbl_delivery_fee">សេវាដឹកជញ្ជូន៖</td><td><input type="text" inputmode="decimal" class="form-control text-end" id="inv-delivery" onfocus="this.value = parseCurrencyStr(this.value) || ''" onblur="this.value = formatCurrency(parseCurrencyStr(this.value), document.getElementById('inv-currency').value)" value="0" step="0.01" oninput="calculateInvoiceTotal()"></td></tr>
                                        <tr><th data-i18n="lbl_grand_total">តម្លៃសរុប៖</th><td><input type="text" class="form-control text-end fw-bold" id="inv-grandtotal" readonly value="0"></td></tr>
                                    </table>
                                </div>
                            </div>
                            <hr>
                            <button type="submit" id="btn-save-invoice" class="btn btn-primary w-100 py-3 fs-5" data-i18n="btn_save_print_invoice">រក្សាទុកជាចំណូល & ព្រីនវិក្កយបត្រ</button>
                            <button type="button" class="btn btn-secondary w-100 py-2 mt-2" onclick="resetInvoiceForm()" data-i18n="btn_cancel_reset">បោះបង់</button>
                        </form>
                    </div>
                </div>

<div class="row g-0 h-100">
    <div class="col-12 h-100">
        <div class="card shadow-sm border-0 border-top border-primary border-4 h-100 d-flex flex-column att-main-card">
            <div class="card-header bg-body d-flex justify-content-between align-items-center flex-wrap gap-2 py-2">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <h5 class="mb-0 text-primary fw-bold" style="font-size: 1.05rem;">📅 គ្រប់គ្រងវត្តមានប្រចាំខែ (Monthly Attendance)</h5>
                    <span class="badge bg-warning bg-opacity-25 text-dark border border-warning px-2 py-1" style="font-size: 0.72rem; font-weight: 500;">
                        <i class="bi bi-calendar2-check me-1"></i>L: Monthly Leave (២ ថ្ងៃ/ខែ)
                    </span>
                </div>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <div class="input-group input-group-sm" style="width: auto;">
                        <button class="btn btn-outline-secondary" type="button" onclick="changeAttendanceMonth(-1)" title="ខែមុន (Previous Month)">
                            <i class="bi bi-chevron-left"></i>
                        </button>
                        <input type="month" class="form-control form-control-sm text-center fw-bold att-month-input" id="attendanceMonth" onchange="loadAttendance()" onclick="handleAttendanceMonthClick(this)" title="ចុចដើម្បីជ្រើសរើសខែ">
                        <button class="btn btn-outline-secondary" type="button" onclick="changeAttendanceMonth(1)" title="ខែបន្ទាប់ (Next Month)">
                            <i class="bi bi-chevron-right"></i>
                        </button>
                        <button class="btn btn-outline-primary" type="button" onclick="openAttendanceMonthModal()" title="ជ្រើសរើសខែ និងឆ្នាំ (Select Month/Year)">
                            <i class="bi bi-calendar3"></i>
                        </button>
                        <button class="btn btn-primary" type="button" onclick="loadAttendance()" title="ស្វែងរក (Search)">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                    <button class="btn btn-sm btn-outline-success fw-bold" onclick="openApplyAllPModal()" title="ដាក់វត្តមាន P គ្រប់បុគ្គលិក">
                        <i class="bi bi-check2-square me-1"></i>ដាក់ P គ្រប់បុគ្គលិក
                    </button>
                    <button class="btn btn-sm btn-success fw-bold" onclick="saveAllAttendance()">
                        <i class="bi bi-save me-1"></i>រក្សាទុកវត្តមាន
                    </button>
                </div>
            </div>
            <div class="card-body p-0 flex-grow-1 overflow-hidden d-flex flex-column">
                <div class="table-responsive flex-grow-1" id="attendance-table-container">
                    <table class="table table-hover table-bordered align-middle text-center mb-0 att-table">
                        <thead class="table-darkgreen" id="attendanceHead">
                            <!-- Dynamically generated -->
                        </thead>
                        <tbody id="attendanceList">
                            <!-- Dynamically generated -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Month Selector for Attendance -->
<div class="modal fade" id="attendanceMonthModal" tabindex="-1" aria-labelledby="attendanceMonthModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="modal-header bg-primary text-white border-bottom py-2">
                <h6 class="modal-title fw-bold" id="attendanceMonthModalLabel">
                    <i class="bi bi-calendar3 me-2"></i>ជ្រើសរើសខែ និងឆ្នាំ (Select Month)
                </h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-3">
                <!-- Year selector -->
                <div class="d-flex align-items-center justify-content-between mb-3 bg-body-tertiary rounded-3 p-2 border">
                    <button type="button" class="btn btn-sm btn-outline-secondary rounded-circle" onclick="changeModalYear(-1)" style="width: 32px; height: 32px;" title="ឆ្នាំមុន (Previous Year)">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <span class="fw-bold fs-5 text-primary" id="attModalYearText">2026</span>
                    <button type="button" class="btn btn-sm btn-outline-secondary rounded-circle" onclick="changeModalYear(1)" style="width: 32px; height: 32px;" title="ឆ្នាំបន្ទាប់ (Next Year)">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
                <!-- 12 Month Grid -->
                <div class="row g-2" id="attModalMonthGrid">
                    <!-- Injected dynamically -->
                </div>
            </div>
            <div class="modal-footer border-0 bg-body-tertiary py-2 justify-content-between">
                <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-bold" onclick="selectCurrentMonthAndYear()">
                    <i class="bi bi-clock-history me-1"></i>ខែនេះ (This Month)
                </button>
                <button type="button" class="btn btn-sm btn-secondary rounded-pill px-3" data-bs-dismiss="modal">បិទ</button>
            </div>
        </div>
    </div>
</div>

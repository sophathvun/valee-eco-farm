<div class="row">
    <div class="card shadow-sm border-0 border-top border-primary border-4">
        <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h5 class="mb-0 text-primary fw-bold">📅 គ្រប់គ្រងវត្តមានប្រចាំខែ (Monthly Attendance)</h5>
            <div class="d-flex align-items-center gap-2">
                <input type="month" class="form-control" id="attendanceMonth" onchange="loadAttendance()">
                <button class="btn btn-primary" onclick="loadAttendance()"><i class="bi bi-search"></i></button>
                <button class="btn btn-success ms-2" onclick="saveAllAttendance()">
                    <i class="bi bi-save"></i> រក្សាទុកវត្តមាន
                </button>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive" id="attendance-table-container">
                <table class="table table-hover table-bordered align-middle text-center mb-0 att-table">
                    <thead class="table-darkgreen" id="attendanceHead">
                        <!-- Dynamically generated -->
                    </thead>
                    <tbody id="attendanceList">
                        <!-- Dynamically generated -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

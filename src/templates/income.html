<style>
/* Income table - Cash columns light green, Bank columns light blue */
#recentIncomeList tr td:nth-child(3),
#recentIncomeList tr td:nth-child(4) { background-color: rgba(25,135,84,0.07); }
#recentIncomeList tr td:nth-child(5),
#recentIncomeList tr td:nth-child(6) { background-color: rgba(13,110,253,0.06); }
</style>
<div class="row">
    <div class="col-md-12">
        <div class="card shadow-sm border-0 border-top border-success border-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0 text-success fw-bold">ប្រវត្តិបញ្ចូលចំណូល</h5>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-success fw-bold write-only" onclick="window.openIncomeModal()">+ បញ្ចូលចំណូល</button>
                    <div class="custom-dropdown">
                        <button class="btn btn-sm btn-outline-success fw-bold dropbtn" onclick="this.parentElement.classList.toggle('show')">ព្រីន របាយការណ៍</button>
                        <div class="custom-dropdown-content">
                            <a href="#" onclick="event.preventDefault(); this.parentElement.parentElement.classList.remove('show'); printListReport('income');">ព្រីន របាយការណ៍ចំណូល</a>
                            <a href="#" onclick="event.preventDefault(); this.parentElement.parentElement.classList.remove('show'); Swal.fire({title: 'ទាញយកជា PDF', text: 'សូមជ្រើសយក \'Save as PDF\' នៅកន្លែងជម្រើស Print ដើម្បីរក្សាទុក។', icon: 'info', confirmButtonText: 'យល់ព្រម', confirmButtonColor: '#28a745'}).then((result) => { if(result.isConfirmed) printListReport('income'); });">ទាញយករបាយការណ៍ជា PDF</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body bg-light pb-2 pt-2 border-bottom">
                <div class="row align-items-end">
                    <div class="col-md-4">
                        <label class="form-label" style="font-size: 13px;">ចាប់ពីថ្ងៃទី (From)</label>
                        <input type="date" class="form-control form-control-sm" id="filter-inc-from" onchange="loadData()">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" style="font-size: 13px;">ដល់ថ្ងៃទី (To)</label>
                        <input type="date" class="form-control form-control-sm" id="filter-inc-to" onchange="loadData()">
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-sm btn-secondary w-100 mb-1" onclick="clearIncFilter()">សំអាត</button>
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                    <table class="table table-sm table-hover mb-0 text-center align-middle" style="font-size: 0.85rem;">
                        <thead class="table-darkgreen" style="position: sticky; top: 0; z-index: 1;">
                            <tr>
                                <th rowspan="2" class="align-middle">កាលបរិច្ឆេទ</th>
                                <th rowspan="2" class="align-middle">ប្រភេទ</th>
                                <th colspan="2" class="text-center border-bottom-0 th-cash-khr">សាច់ប្រាក់</th>
                                <th colspan="2" class="text-center border-bottom-0 th-bank-khr">ឧនាគារ</th>
                                <th rowspan="2" class="align-middle">កំណត់សម្គាល់</th>
                                <th rowspan="2" class="align-middle" style="width: 80px;"></th>
                            </tr>
                            <tr>
                                <th class="text-center border-top-0 th-cash-khr">៛</th>
                                <th class="text-center border-top-0 th-cash-usd">$</th>
                                <th class="text-center border-top-0 th-bank-khr">៛</th>
                                <th class="text-center border-top-0 th-bank-usd">$</th>
                            </tr>
                        </thead>
                        <tbody id="recentIncomeList"></tbody>
                        <tfoot class="fw-bold border-top" style="position: sticky; bottom: 0; z-index: 1; font-size: 0.82rem;">
                            <tr class="table-light">
                                <td colspan="2" class="text-end">&#x179F;&#x179A;&#x17BB;&#x1794;</td>
                                <td id="list-inc-cash-khr" class="text-success text-center">&#x17DB;0</td>
                                <td id="list-inc-cash-usd" class="text-success text-center">$0.00</td>
                                <td id="list-inc-bank-khr" class="text-success text-center">&#x17DB;0</td>
                                <td id="list-inc-bank-usd" class="text-success text-center">$0.00</td>
                                <td colspan="2"></td>
                            </tr>
                            <tr style="background-color:#d4edda;">
                                <td colspan="2" class="text-end text-success">&#x179F;&#x179A;&#x17BB;&#x1794;&#x179F;&#x17B6;&#x1785;&#x17CB;&#x1794;&#x17D2;&#x179A;&#x17B6;&#x1780;</td>
                                <td colspan="2" id="list-inc-cash-subtotal" class="text-success text-center">$0.00 = &#x17DB;0</td>
                                <td colspan="2" id="list-inc-bank-subtotal" class="text-success text-center">$0.00 = &#x17DB;0</td>
                                <td colspan="2"></td>
                            </tr>
                            <tr style="background-color:#c3e6cb;">
                                <td colspan="2" class="text-end text-success fw-bolder">&#x179F;&#x179A;&#x17BB;&#x1794;&#x179A;&#x179D;&#x1798;</td>
                                <td colspan="4" id="list-inc-grand-total" class="text-success text-center fw-bolder">$0.00 = &#x17DB;0</td>
                                <td colspan="2"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
            
        </div>
    </div>
</div>

<!-- Modal for Add/Edit Income -->
<div class="modal fade write-only" id="incomeModal" tabindex="-1" aria-labelledby="incomeModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0 border-top border-success border-4 shadow">
      <div class="modal-header">
        <h5 class="modal-title text-success fw-bold" id="incomeModalLabel">បញ្ចូលទិន្នន័យចំណូលផ្ទាល់</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
          <form id="incomeForm">
          
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label class="form-label">រូបិយប័ណ្ណ</label>
                                            <select class="form-select" id="inc-currency" required><option value="KHR">ប្រាក់រៀល (៛)</option><option value="USD">ដុល្លារអាមេរិក ($)</option></select>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="d-flex justify-content-between align-items-center mb-2">
                                                <label class="form-label mb-0">ចំនួនទឹកប្រាក់</label>
                                                <small class="text-primary fw-bold" id="inc-converted-amount"></small>
                                            </div>
                                            <input type="number" class="form-control" id="inc-amount" required min="0" step="0.01">
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                          <div class="col-md-6">
                                              <label class="form-label">កាលបរិច្ឆេទ</label>
                                              <input type="date" class="form-control" id="inc-date" required>
                                          </div>
                                          <div class="col-md-6">
                                              <label class="form-label">វិធីទូទាត់ (Payment)</label>
                                              <select class="form-select" id="inc-method" required>
                                                  <option value="Cash">សាច់ប្រាក់ (Cash)</option>
                                                  <option value="Bank">ធនាគារ (Bank)</option>
                                              </select>
                                          </div>
                                      </div>
                                    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">អត្រាប្តូរប្រាក់ (Exchange Rate)</label>
            <div class="input-group">
                <span class="input-group-text">1$ =</span>
                <input type="number" class="form-control" id="inc-exchange-rate" step="1" required>
                <span class="input-group-text">៛</span>
            </div>
        </div>
        <div class="col-md-6">
            <label class="form-label">ប្រភេទទិន្នន័យ</label>
            <select class="form-select" id="inc-category" required></select>
        </div>
    </div>
                                    <div class="mb-4">
                                        <label class="form-label">កំណត់សម្គាល់</label>
                                        <input type="text" class="form-control" id="inc-note" placeholder="ឧ. លក់ជ្រូក ៥ក្បាល">
                                    </div>
                                    <button type="submit" class="btn btn-success w-100 py-2 fs-5">រក្សាទុកចំណូល</button>
                                
          </form>
      </div>
    </div>
  </div>
</div>
